<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Project Tracker — Creative Portfolio</title>
  <meta name="description" content="Minimal role-based tracker for creative projects: portfolio dashboard, timelines, team progress, meetings and audit history." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232563EB'/%3E%3Crect x='7' y='9' width='14' height='3.5' rx='1.75' fill='white'/%3E%3Crect x='11' y='14.5' width='14' height='3.5' rx='1.75' fill='white' opacity='.75'/%3E%3Crect x='7' y='20' width='10' height='3.5' rx='1.75' fill='white' opacity='.5'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <a class="skip-link" href="#view">Skip to main content</a>

  <div class="app">
    <div class="sidebar-scrim" id="sidebarScrim"></div>

    <aside class="sidebar" id="sidebar" aria-label="Primary navigation">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 6h12M8 12h12M4 18h8"/></svg>
        </span>
        <div>
          <div class="brand-name">Tracker</div>
          <div class="brand-sub">Creative portfolio</div>
        </div>
      </div>
      <nav class="nav" id="nav" aria-label="Main"></nav>
      <div class="sidebar-foot">
        <button class="reset-btn" data-action="reset-demo" type="button">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 2.6-6.4"/><path d="M3 4v5h5"/></svg>
          Reset demo data
        </button>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <button class="menu-btn" id="menuBtn" type="button" aria-label="Open navigation" aria-expanded="false">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <div class="topbar-title" id="topbarTitle">Dashboard</div>
        <div class="topbar-spacer"></div>
        <div class="role-switch">
          <label for="userSelect">Viewing as</label>
          <select id="userSelect" aria-label="Switch user"></select>
          <span class="role-chip" id="roleChip">PM</span>
        </div>
      </header>
      <main class="view" id="view" tabindex="-1"></main>
    </div>
  </div>

  <div id="modalRoot"></div>
  <div id="drawerRoot"></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
